name: API Tests

on:
  pull_request:
    paths:
      - 'Localite/**'
      - '.github/workflows/api-test.yml'
  push:
    paths:
      - 'Localite/**'
      - '.github/workflows/api-test.yml'
  workflow_dispatch:

concurrency:
  group: api-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Localite

jobs:
  api-tests:
    name: Jest + Supertest (31 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: localite_test_db
      JWT_SECRET: test-jwt-secret-localite
      JWT_REFRESH_SECRET: test-jwt-refresh-secret-localite
      DISABLE_AUTH_RATE_LIMIT: 'true'
      DEV_OTP: '123456'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Localite/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run API integration tests
        run: npm run test:api:ci
