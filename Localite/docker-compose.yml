version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: localite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: localite_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - localite_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  localite_pg_data:
